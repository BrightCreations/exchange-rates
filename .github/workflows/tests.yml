name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]
        laravel: ['12', '13']
        exclude:
          # Laravel 13 needs PHP 8.3+
          - php: 8.2
            laravel: '13'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
        coverage: none

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction

    # composer.lock is resolved on PHP 8.2 (Laravel 12), so the Laravel 13 jobs update past it
    - name: Move to Laravel 13
      if: matrix.laravel == '13'
      run: composer update --prefer-dist --no-interaction -W --with "illuminate/support:^13.0" --with "orchestra/testbench:^11.0"

    - name: Run Pint
      run: vendor/bin/pint --test

    - name: Execute tests (Unit and Feature tests) via Pest
      run: vendor/bin/pest 
